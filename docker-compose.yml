services:
  db:
    image: postgis/postgis:16-3.4
    container_name: kulti-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-test:
    image: postgis/postgis:16-3.4
    container_name: kulti-db-test
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: kulti_test
      POSTGRES_PASSWORD: kulti_test
      POSTGRES_DB: kulti_test
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata:
